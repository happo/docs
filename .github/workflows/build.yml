name: Build

# Builds the site so broken links, anchors and Markdown links fail the PR
# instead of the deploy. docusaurus.config.js sets these checks to throw.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Build
        run: pnpm build
