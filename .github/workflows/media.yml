name: Media

# Binary files stay in git history forever, so this checks that images and
# videos added or changed in a PR were optimized first. See media/README.md.

on:
  pull_request:
    branches: [main]

jobs:
  check-media:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin main

      - name: Find added and changed media
        id: changed
        run: |
          files=$(git diff --name-only --no-renames --diff-filter=AM origin/main...HEAD -- \
            ':(icase)static/*.png' ':(icase)static/*.gif' ':(icase)static/*.webm')
          echo "$files"
          {
            echo 'files<<EOF'
            echo "$files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Setup environment
        if: steps.changed.outputs.files != ''
        uses: ./.github/actions/setup-env

      # Fails with the command to run if a file isn't optimized. Only warns
      # about GIFs.
      - name: Check media
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          mapfile -t files <<< "$FILES"
          pnpm --silent media optimize --check "${files[@]}"
